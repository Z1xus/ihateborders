name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: .github\msvc.cmd
        shell: cmd

      - run: rustup toolchain install

      - run: bash .github/build.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ihateborders
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ihateborders

      - run: sha256sum ihateborders.exe BUILD.txt > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ihateborders.exe

      - run: gh release create "$GITHUB_REF_NAME" ihateborders.exe BUILD.txt SHA256SUMS.txt --verify-tag --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
