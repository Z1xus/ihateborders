[package]
name = "ihateborders"
version = "2.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["ico"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.100.0"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
